version: "3.9"

services:
  backend:
    build:
      context: ./api
    container_name: fastapi-backend
    ports:
      - "8000:80"
    volumes:
      - ./api:/code
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: react-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
